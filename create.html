<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Blanket | WovenDays</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="assets/Object.png" alt="WovenDays logo" class="logo">
            <h1>Create Your Blanket</h1>
        </div>

        <form id="blanketForm">
            <div class="form-group">
                <label for="projectName">Project Name</label>
                <input type="text" id="projectName" placeholder="e.g. 2026 Mood Blanket" required>
            </div>

            <div class="form-group">
                <label for="blanketType">Blanket Type</label>
                <select id="blanketType" required>
                    <option value="">Choose blanket type...</option>
                    <option value="Temperature">Temperature Blanket</option>
                    <option value="Mood">Mood Blanket</option>
                    <option value="Reading">Reading Blanket</option>
                    <option value="Fitness">Fitness Blanket</option>
                    <option value="Hydration">Hydration Blanket</option>
                    <option value="Custom">Custom Blanket</option>
                </select>
            </div>

            <div class="form-group">
                <label for="width">Blanket Width (stitches)</label>
                <input type="number" id="width" placeholder="120" min="10" max="500" value="120" required>
            </div>

            <div class="form-group">
                <label for="startDate">Start Date</label>
                <input type="date" id="startDate" required>
            </div>

            <div class="form-group">
                <label for="endDate">End Date</label>
                <input type="date" id="endDate" required>
            </div>

            <button type="submit" class="btn-primary">Continue to Color Legend →</button>
        </form>
    </div>
    <script src="create.js"></script>
</body>
</html>
