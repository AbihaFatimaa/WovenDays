<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Blanket | WovenDays</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <img src="assets/Object.png" alt="WovenDays Logo" class="logo">
            <h1>Create Your Blanket</h1>
        </div>

        <form id="blanketForm">

            <label for="projectName">Project Name</label>
            <input
                type="text"
                id="projectName"
                placeholder="e.g. 2027 Mood Blanket"
            >

            <label for="blanketType">Blanket Type</label>

            <select id="blanketType">

                <option value="">Choose one</option>

                <option>Temperature Blanket</option>

                <option>Mood Blanket</option>

                <option>Reading Blanket</option>

                <option>Fitness Blanket</option>

                <option>Hydration Blanket</option>

                <option>Custom Blanket</option>

            </select>

            <label for="width">Blanket Width (stitches)</label>

            <input
                type="number"
                id="width"
                placeholder="120"
            >

            <label for="startDate">Start Date</label>

            <input
                type="date"
                id="startDate"
            >

            <label for="endDate">End Date</label>

            <input
                type="date"
                id="endDate"
            >

            <button type="submit">
                Continue
            </button>

        </form>

    </div>

</body>
</html>
